name: CI

# When this workflow runs:
#  - on every pull request into main (runs the tests)
#  - on every push to main, which includes merged pull requests (tests + publish image)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---------- Job 1: run the tests ----------
  test:
    runs-on: ubuntu-latest

    # Start a real Postgres database next to the job, just for the tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: suppliers
        ports:
          - 5432:5432
        # Wait until Postgres is ready before running the steps
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    # Tells the app where the test database is
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/suppliers

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  # ---------- Job 2: build and publish the Docker image ----------
  build-and-push:
    # Only runs if the tests passed
    needs: test
    # Only publish on pushes to main, not on pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # Lets this job push images to GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is created automatically for every run; no secret setup needed
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set the image name
        # Registry image names must be lowercase, so convert owner/repo to lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push the image
        run: |
          # Tag with "latest" and with the commit ID, so every version is saved
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
